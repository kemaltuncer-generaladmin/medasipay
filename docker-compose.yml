services:
  web:
    build:
      context: .
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - APP_URL=${APP_URL:-http://localhost:3000}
      - APP_ENV=${APP_ENV:-local}
      - DATA_DIR=/data
      - MEDASIPAY_API_KEY=${MEDASIPAY_API_KEY:-}
      - MEDASIPAY_ADMIN_KEY=${MEDASIPAY_ADMIN_KEY:-}
      - MEDASIPAY_WEBHOOK_SECRET=${MEDASIPAY_WEBHOOK_SECRET:-}
      - QLINIK_PAYMENT_WEBHOOK_URL=${QLINIK_PAYMENT_WEBHOOK_URL:-https://qlinik.medasi.com.tr/functions/v1/qlinik}
      - PRATICASE_PAYMENT_WEBHOOK_URL=${PRATICASE_PAYMENT_WEBHOOK_URL:-https://qlinik.medasi.com.tr/functions/v1/praticase-storekit-verify}
      - SOURCEBASE_PAYMENT_WEBHOOK_URL=${SOURCEBASE_PAYMENT_WEBHOOK_URL:-https://medasi.com.tr/functions/v1/sourcebase}
      - BANK_ACCOUNT_NAME=${BANK_ACCOUNT_NAME:-MedAsi Teknoloji A.Ş.}
      - BANK_IBAN=${BANK_IBAN:-}
      - KUVEYT_POS_ENV=${KUVEYT_POS_ENV:-production}
      - KUVEYT_POS_CUSTOMER_ID=${KUVEYT_POS_CUSTOMER_ID:-}
      - KUVEYT_POS_MERCHANT_ID=${KUVEYT_POS_MERCHANT_ID:-}
      - KUVEYT_POS_USER_NAME=${KUVEYT_POS_USER_NAME:-}
      - KUVEYT_POS_PASSWORD=${KUVEYT_POS_PASSWORD:-}
      - KUVEYT_POS_CURRENCY_CODE=${KUVEYT_POS_CURRENCY_CODE:-0949}
      - KUVEYT_POS_INSTALLMENT_COUNT=${KUVEYT_POS_INSTALLMENT_COUNT:-0}
      - KUVEYT_POS_PAY_GATE_API_VERSION=${KUVEYT_POS_PAY_GATE_API_VERSION:-TDV2.0.0}
      - KUVEYT_POS_PROVISION_GATE_API_VERSION=${KUVEYT_POS_PROVISION_GATE_API_VERSION:-1.0.0}
      - KUVEYT_POS_PAY_GATE_URL=${KUVEYT_POS_PAY_GATE_URL:-}
      - KUVEYT_POS_PROVISION_GATE_URL=${KUVEYT_POS_PROVISION_GATE_URL:-}
      - KUVEYT_POS_TIMEOUT_MS=${KUVEYT_POS_TIMEOUT_MS:-60000}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SUPPORT_EMAIL=${SUPPORT_EMAIL:-destek@medasi.com.tr}
      - SUPPORT_FROM_EMAIL=${SUPPORT_FROM_EMAIL:-MedAsi Destek <destek@medasi.com.tr>}
      - SUPPORT_CORS_ORIGINS=${SUPPORT_CORS_ORIGINS:-https://odeme.medasi.com.tr,https://indir.medasi.com.tr}
    volumes:
      - medasipay_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  medasipay_data:
